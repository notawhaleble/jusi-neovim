<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>jusi-neovim</title>
    <style>
      :root {
        --bg: #16161d;
        --panel: #232634;
        --text: #d9dde7;
        --muted: #8a90a6;
        --grid: rgba(255, 255, 255, 0.04);
        --accent: #c6a15b;
        --outline: rgba(198, 161, 91, 0.35);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: "Iosevka Term", "SF Mono", monospace;
        color: var(--text);
        background:
          linear-gradient(180deg, rgba(255,255,255,0.04), transparent 30%),
          radial-gradient(circle at top right, rgba(198, 161, 91, 0.18), transparent 28%),
          var(--bg);
      }

      .shell {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 340px;
        min-height: 100vh;
      }

      .stage {
        position: relative;
        overflow: hidden;
        background-image:
          linear-gradient(var(--grid) 1px, transparent 1px),
          linear-gradient(90deg, var(--grid) 1px, transparent 1px);
        background-size: 18px 18px, 9px 18px;
      }

      #terminal-screen {
        position: absolute;
        inset: 0;
        margin: 0;
        padding: 0;
        max-height: none;
        white-space: pre;
        overflow: hidden;
        font-family: inherit;
        font-size: 14px;
        line-height: 18px;
        font-variant-ligatures: none;
        letter-spacing: 0;
        color: var(--text);
        background: transparent;
        border: 0;
        z-index: 0;
      }

      #grid-layer-root {
        position: absolute;
        inset: 0;
        z-index: 0;
      }

      .grid-layer {
        position: absolute;
        margin: 0;
        padding: 0;
        max-height: none;
        overflow: hidden;
        white-space: pre;
        font-family: inherit;
        font-size: 14px;
        line-height: 18px;
        font-variant-ligatures: none;
        letter-spacing: 0;
        color: var(--text);
        background: transparent;
        border: 0;
        pointer-events: auto;
      }

      #cell-ruler {
        position: absolute;
        top: -1000px;
        left: -1000px;
        white-space: pre;
        font-family: "Iosevka Term", "SF Mono", monospace;
        font-size: 14px;
        line-height: 18px;
        font-variant-ligatures: none;
        letter-spacing: 0;
        visibility: hidden;
        pointer-events: none;
      }

      #terminal-cursor {
        position: absolute;
        width: 9px;
        height: 18px;
        background: rgba(217, 221, 231, 0.45);
        pointer-events: none;
        z-index: 1;
      }

      #window-frame-layer {
        position: absolute;
        inset: 0;
        pointer-events: none;
        z-index: 4;
      }

      #cmdline-layer {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        min-height: 18px;
        padding: 2px 8px;
        font-size: 14px;
        line-height: 18px;
        font-family: "Iosevka Term", "SF Mono", monospace;
        color: #d9dde7;
        background: rgba(12, 14, 19, 0.96);
        border-top: 1px solid rgba(255, 255, 255, 0.08);
        opacity: 0;
        pointer-events: none;
        z-index: 5;
      }

      .cmdline-layer--visible {
        opacity: 1 !important;
      }

      #popupmenu-layer {
        position: absolute;
        min-width: 160px;
        max-width: 360px;
        background: rgba(12, 14, 19, 0.96);
        border: 1px solid rgba(255, 255, 255, 0.08);
        box-shadow: 0 10px 28px rgba(0, 0, 0, 0.35);
        opacity: 0;
        pointer-events: none;
        z-index: 6;
      }

      .popupmenu-layer--visible {
        opacity: 1 !important;
      }

      .popupmenu-item {
        padding: 3px 8px;
        font-size: 14px;
        line-height: 18px;
        color: #d9dde7;
        white-space: pre;
      }

      .popupmenu-item--selected {
        background: rgba(198, 161, 91, 0.24);
        color: #fff1cf;
      }

      .window-frame {
        position: absolute;
        border: 1px solid rgba(255, 255, 255, 0.14);
        box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.04);
      }

      .window-frame--active {
        border-color: rgba(198, 161, 91, 0.7);
        box-shadow: inset 0 0 0 1px rgba(198, 161, 91, 0.25);
      }

      .window-frame__label {
        position: absolute;
        top: 0;
        right: 0;
        padding: 2px 6px;
        font-size: 10px;
        color: rgba(217, 221, 231, 0.78);
        background: rgba(0, 0, 0, 0.35);
      }

      .stage::before {
        content: "";
        position: absolute;
        inset: 0;
        border-right: 1px solid rgba(255,255,255,0.06);
        pointer-events: none;
      }

      #web-view-layer {
        position: absolute;
        inset: 0;
        z-index: 3;
      }

      .web-view-box {
        position: absolute;
        border: 1px solid var(--outline);
        background: rgba(28, 30, 39, 0.92);
        box-shadow: 0 14px 40px rgba(0, 0, 0, 0.28);
        overflow: hidden;
        display: grid;
        grid-template-rows: auto auto minmax(0, 1fr);
      }

      .web-view-box--active {
        border-color: rgba(198, 161, 91, 0.8);
        box-shadow:
          0 14px 40px rgba(0, 0, 0, 0.28),
          inset 0 0 0 1px rgba(198, 161, 91, 0.25);
      }

      .web-view-box--parked {
        visibility: hidden;
        pointer-events: none;
      }

      .web-view-box__title {
        padding: 10px 12px 6px;
        color: var(--accent);
        font-size: 13px;
      }

      .web-view-box__meta {
        padding: 0 12px 8px;
        color: var(--muted);
        font-size: 12px;
      }

      .web-view-box__browser {
        width: 100%;
        height: 100%;
        border: 0;
        background: white;
      }

      .sidebar {
        padding: 18px;
        background: rgba(17, 18, 24, 0.88);
        backdrop-filter: blur(14px);
      }

      .sidebar h1 {
        margin: 0 0 14px;
        font-size: 18px;
        font-weight: 600;
      }

      .stats {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 10px;
        margin-bottom: 16px;
      }

      .stat {
        padding: 10px 12px;
        background: var(--panel);
        border: 1px solid rgba(255,255,255,0.06);
      }

      .stat__label {
        color: var(--muted);
        font-size: 11px;
        text-transform: uppercase;
      }

      .stat__value {
        margin-top: 6px;
        font-size: 18px;
      }

      .sidebar pre {
        margin: 0;
        padding: 14px;
        max-height: calc(100vh - 220px);
        overflow: auto;
        font-size: 12px;
        line-height: 1.45;
        background: var(--panel);
        border: 1px solid rgba(255,255,255,0.06);
      }

      @media (max-width: 960px) {
        .shell {
          grid-template-columns: 1fr;
        }

        .sidebar {
          order: -1;
        }
      }
    </style>
  </head>
  <body>
    <div id="cell-ruler">MMMMMMMMMM</div>
    <div class="shell">
      <div class="stage">
        <pre id="terminal-screen"></pre>
        <div id="grid-layer-root"></div>
        <div id="terminal-cursor"></div>
        <div id="window-frame-layer"></div>
        <div id="web-view-layer"></div>
        <div id="popupmenu-layer"></div>
        <div id="cmdline-layer"></div>
      </div>
      <aside class="sidebar">
        <h1>jusi-neovim</h1>
        <div class="stats">
          <div class="stat"><div class="stat__label">Tab</div><div class="stat__value" id="status-tab">-</div></div>
          <div class="stat"><div class="stat__label">Buffers</div><div class="stat__value" id="status-buffers">-</div></div>
          <div class="stat"><div class="stat__label">Windows</div><div class="stat__value" id="status-windows">-</div></div>
          <div class="stat"><div class="stat__label">Web Views</div><div class="stat__value" id="status-webviews">-</div></div>
        </div>
        <pre id="state-dump"></pre>
      </aside>
    </div>
    <script type="module" src="../../dist/renderer/app.js"></script>
  </body>
  </html>
