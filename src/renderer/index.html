<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>jusi-neovim</title>
    <style>
      :root {
        --bg: #16161d;
        --panel: #232634;
        --text: #d9dde7;
        --muted: #8a90a6;
        --accent: #c6a15b;
        --outline: rgba(198, 161, 91, 0.35);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: "Iosevka Term", "SF Mono", monospace;
        color: var(--text);
        background: var(--bg);
      }

      .shell {
        display: grid;
        grid-template-columns: minmax(0, 1fr);
        min-height: 100vh;
      }

      body.debug-ui .shell {
        grid-template-columns: minmax(0, 1fr) 340px;
      }

      .stage {
        position: relative;
        width: 100%;
        height: 100vh;
        overflow: hidden;
        background: var(--bg);
      }

      #terminal-screen {
        position: absolute;
        inset: 0;
        margin: 0;
        padding: 0;
        max-height: none;
        white-space: pre;
        overflow: hidden;
        font-family: inherit;
        font-size: 14px;
        line-height: 18px;
        font-variant-ligatures: none;
        letter-spacing: 0;
        color: var(--text);
        background: transparent;
        border: 0;
        z-index: 0;
      }

      #grid-layer-root {
        position: absolute;
        inset: 0;
      }

      .grid-layer {
        position: absolute;
        margin: 0;
        padding: 0;
        max-height: none;
        overflow: hidden;
        white-space: pre;
        font-family: inherit;
        font-size: 14px;
        line-height: 18px;
        font-variant-ligatures: none;
        letter-spacing: 0;
        color: var(--text);
        background: var(--bg);
        border: 0;
        pointer-events: auto;
      }

      #cell-ruler {
        position: absolute;
        top: -1000px;
        left: -1000px;
        white-space: pre;
        font-family: "Iosevka Term", "SF Mono", monospace;
        font-size: 14px;
        line-height: 18px;
        font-variant-ligatures: none;
        letter-spacing: 0;
        visibility: hidden;
        pointer-events: none;
      }

      #terminal-cursor {
        position: absolute;
        width: 9px;
        height: 18px;
        background: var(--text);
        opacity: 0.65;
        pointer-events: none;
        z-index: 1200;
      }

      #window-frame-layer {
        position: absolute;
        inset: 0;
        pointer-events: none;
      }

      #cmdline-layer {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        min-height: 18px;
        padding: 0;
        font-size: 14px;
        line-height: 18px;
        font-family: "Iosevka Term", "SF Mono", monospace;
        color: var(--text);
        background: var(--bg);
        border: 0;
        opacity: 0;
        pointer-events: none;
        z-index: 4000;
      }

      .cmdline-layer--visible {
        opacity: 1 !important;
      }

      #cmdline-block-layer {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 18px;
        display: grid;
        gap: 0;
        padding: 0;
        background: var(--bg);
        border: 0;
        box-shadow: none;
        opacity: 0;
        pointer-events: none;
        z-index: 3990;
      }

      .cmdline-block-layer--visible {
        opacity: 1 !important;
      }

      .cmdline-block-line {
        white-space: pre;
        font-size: 14px;
        line-height: 18px;
      }

      #popupmenu-layer {
        position: absolute;
        min-width: 160px;
        max-width: 360px;
        background: rgba(12, 14, 19, 0.96);
        border: 1px solid rgba(255, 255, 255, 0.08);
        box-shadow: 0 10px 28px rgba(0, 0, 0, 0.35);
        opacity: 0;
        pointer-events: none;
        z-index: 4100;
      }

      .popupmenu-layer--visible {
        opacity: 1 !important;
      }

      .popupmenu-item {
        padding: 3px 8px;
        font-size: 14px;
        line-height: 18px;
        color: #d9dde7;
        white-space: pre;
      }

      .popupmenu-item--selected {
        background: rgba(198, 161, 91, 0.24);
        color: #fff1cf;
      }

      #message-layer {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        display: grid;
        gap: 0;
        opacity: 0;
        pointer-events: none;
        z-index: 3900;
      }

      .message-layer--visible {
        opacity: 1 !important;
      }

      .message-entry {
        min-height: 18px;
        padding: 0;
        border: 0;
        background: var(--bg);
        box-shadow: none;
        white-space: pre;
        overflow: hidden;
        text-overflow: clip;
        font-size: 14px;
        line-height: 18px;
      }

      .message-entry--emsg,
      .message-entry--echoerr,
      .message-entry--lua_error,
      .message-entry--rpc_error {
        color: #ff9a9a;
        background: var(--bg);
      }

      #message-status-layer {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) auto;
        gap: 0;
        padding: 0;
        font-size: 14px;
        line-height: 18px;
        color: var(--text);
        background: var(--bg);
        opacity: 0;
        pointer-events: none;
        z-index: 3950;
      }

      .message-status-layer--visible {
        opacity: 1 !important;
      }

      .message-status__center {
        text-align: center;
      }

      .message-status__right {
        text-align: right;
      }

      #message-history-layer {
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        width: min(760px, calc(100% - 48px));
        max-height: min(60vh, 640px);
        overflow: auto;
        padding: 14px;
        display: grid;
        gap: 8px;
        border: 1px solid rgba(255, 255, 255, 0.08);
        background: rgba(12, 14, 19, 0.97);
        box-shadow: 0 18px 50px rgba(0, 0, 0, 0.45);
        opacity: 0;
        pointer-events: none;
        z-index: 4200;
      }

      .message-history-layer--visible {
        opacity: 1 !important;
      }

      .message-history-entry {
        padding: 6px 8px;
        white-space: pre-wrap;
        border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      }

      .window-frame {
        position: absolute;
        border: 0;
        box-shadow: none;
      }

      .window-frame--active {
        box-shadow: none;
      }

      .window-frame__label {
        display: none;
      }

      .stage::before {
        content: none;
      }

      #web-view-layer {
        position: absolute;
        inset: 0;
      }

      .web-view-box {
        position: absolute;
        border: 0;
        background: white;
        box-shadow: none;
        overflow: hidden;
        display: block;
      }

      .web-view-box--active {
        box-shadow: inset 0 0 0 1px rgba(198, 161, 91, 0.35);
      }

      .web-view-box--parked {
        visibility: hidden;
        pointer-events: none;
      }

      .web-view-box__title {
        display: none;
      }

      .web-view-box__meta {
        display: none;
      }

      .web-view-box__browser {
        width: 100%;
        height: 100%;
        border: 0;
        background: white;
      }

      .sidebar {
        display: none;
      }

      body.debug-ui .sidebar {
        display: block;
        padding: 18px;
        background: rgba(17, 18, 24, 0.88);
        backdrop-filter: blur(14px);
      }

      .sidebar h1 {
        margin: 0 0 14px;
        font-size: 18px;
        font-weight: 600;
      }

      .stats {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 10px;
        margin-bottom: 16px;
      }

      .stat {
        padding: 10px 12px;
        background: var(--panel);
        border: 1px solid rgba(255,255,255,0.06);
      }

      .stat__label {
        color: var(--muted);
        font-size: 11px;
        text-transform: uppercase;
      }

      .stat__value {
        margin-top: 6px;
        font-size: 18px;
      }

      .sidebar pre {
        margin: 0;
        padding: 14px;
        max-height: calc(100vh - 220px);
        overflow: auto;
        font-size: 12px;
        line-height: 1.45;
        background: var(--panel);
        border: 1px solid rgba(255,255,255,0.06);
      }

      @media (max-width: 960px) {
        .shell {
          grid-template-columns: 1fr;
        }

        .sidebar {
          order: -1;
        }
      }
    </style>
  </head>
  <body>
    <div id="cell-ruler">MMMMMMMMMM</div>
    <div class="shell">
      <div class="stage">
        <pre id="terminal-screen"></pre>
        <div id="grid-layer-root"></div>
        <div id="terminal-cursor"></div>
        <div id="window-frame-layer"></div>
        <div id="web-view-layer"></div>
        <div id="message-layer"></div>
        <div id="message-status-layer">
          <div data-role="showmode"></div>
          <div class="message-status__center" data-role="showcmd"></div>
          <div class="message-status__right" data-role="ruler"></div>
        </div>
        <div id="message-history-layer"></div>
        <div id="cmdline-block-layer"></div>
        <div id="popupmenu-layer"></div>
        <div id="cmdline-layer"></div>
      </div>
      <aside class="sidebar">
        <h1>jusi-neovim</h1>
        <div class="stats">
          <div class="stat"><div class="stat__label">Tab</div><div class="stat__value" id="status-tab">-</div></div>
          <div class="stat"><div class="stat__label">Buffers</div><div class="stat__value" id="status-buffers">-</div></div>
          <div class="stat"><div class="stat__label">Windows</div><div class="stat__value" id="status-windows">-</div></div>
          <div class="stat"><div class="stat__label">Web Views</div><div class="stat__value" id="status-webviews">-</div></div>
        </div>
        <pre id="state-dump"></pre>
      </aside>
    </div>
    <script type="module" src="../../dist/renderer/app.js"></script>
  </body>
  </html>
