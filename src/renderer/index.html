<!doctype html>
<html lang="en">
  <head>
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; frame-src https: http: jusi-directory: about:; base-uri 'none'; form-action 'none'; object-src 'none'">
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>jusi-neovim</title>
    <style>
      :root {
        --bg: #16161d;
        --panel: #232634;
        --text: #d9dde7;
        --muted: #8a90a6;
        --accent: #c6a15b;
        --outline: rgba(198, 161, 91, 0.35);
        --terminal-font-size: 14px;
        --terminal-line-height: 18px;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: "Iosevka Term", "SF Mono", monospace;
        color: var(--text);
        background: var(--bg);
      }

      body.pointer-hidden,
      body.pointer-hidden * {
        cursor: none !important;
      }

      .shell {
        display: grid;
        grid-template-columns: minmax(0, 1fr);
        min-height: 100vh;
      }

      body.debug-ui .shell {
        grid-template-columns: minmax(0, 1fr) 340px;
      }

      .stage {
        position: relative;
        width: 100%;
        height: 100vh;
        overflow: hidden;
        background: var(--bg);
      }

      .stage:focus,
      .web-view-box:focus,
      .web-view-box__browser:focus {
        outline: none;
      }

      #terminal-screen {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        margin: 0;
        padding: 0;
        max-height: none;
        white-space: pre;
        overflow: hidden;
        font-family: inherit;
        font-size: var(--terminal-font-size);
        line-height: var(--terminal-line-height);
        font-variant-ligatures: none;
        letter-spacing: 0;
        color: var(--text);
        background: transparent;
        border: 0;
        z-index: 0;
      }

      #grid-layer-root {
        pointer-events: none;
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        overflow: hidden;
      }

      .grid-layer {
        position: absolute;
        margin: 0;
        padding: 0;
        max-height: none;
        overflow: hidden;
        white-space: pre;
        font-family: inherit;
        font-size: var(--terminal-font-size);
        line-height: var(--terminal-line-height);
        font-variant-ligatures: none;
        letter-spacing: 0;
        color: var(--text);
        background: var(--bg);
        border: 0;
        pointer-events: auto;
      }

      #cell-ruler {
        position: absolute;
        top: -1000px;
        left: -1000px;
        white-space: pre;
        font-family: "Iosevka Term", "SF Mono", monospace;
        font-size: var(--terminal-font-size);
        line-height: var(--terminal-line-height);
        font-variant-ligatures: none;
        letter-spacing: 0;
        visibility: hidden;
        pointer-events: none;
      }

      #terminal-cursor {
        position: absolute;
        width: 9px;
        height: 18px;
        background: var(--text);
        opacity: 0.65;
        pointer-events: none;
        z-index: 1200;
      }

      #window-frame-layer {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        overflow: hidden;
        pointer-events: none;
      }

      #cmdline-layer {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        min-height: var(--terminal-line-height);
        padding: 0;
        font-size: var(--terminal-font-size);
        line-height: var(--terminal-line-height);
        font-family: "Iosevka Term", "SF Mono", monospace;
        color: var(--text);
        background: var(--bg);
        border: 0;
        overflow: hidden;
        opacity: 0;
        pointer-events: none;
        white-space: pre;
        z-index: 4000;
      }

      .cmdline-layer--visible {
        opacity: 1 !important;
      }

      #cmdline-block-layer {
        position: absolute;
        left: 0;
        right: 0;
        bottom: var(--terminal-line-height);
        display: grid;
        gap: 0;
        padding: 0;
        background: var(--bg);
        border: 0;
        box-shadow: none;
        opacity: 0;
        pointer-events: none;
        z-index: 3990;
      }

      .cmdline-block-layer--visible {
        opacity: 1 !important;
      }

      .popupmenu-info {
        white-space: pre-wrap;
        max-width: 60ch;
        opacity: 0.85;
      }

      .cmdline-block-line {
        overflow: hidden;
        white-space: pre;
        font-size: var(--terminal-font-size);
        line-height: var(--terminal-line-height);
      }

      .cmdline-cursor {
        position: absolute;
        top: 0;
        pointer-events: none;
        opacity: 0.65;
        z-index: 1;
      }

      #popupmenu-layer {
        position: absolute;
        min-width: 160px;
        max-width: 360px;
        background: rgba(12, 14, 19, 0.96);
        border: 1px solid rgba(255, 255, 255, 0.08);
        box-shadow: 0 10px 28px rgba(0, 0, 0, 0.35);
        opacity: 0;
        overflow-x: hidden;
        overflow-y: auto;
        pointer-events: none;
        z-index: 4100;
      }

      .popupmenu-layer--visible {
        opacity: 1 !important;
        pointer-events: auto !important;
      }

      .popupmenu-item {
        padding: 3px 8px;
        font-size: var(--terminal-font-size);
        line-height: var(--terminal-line-height);
        color: #d9dde7;
        white-space: pre;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .popupmenu-item--selected {
        background: rgba(198, 161, 91, 0.24);
        color: #fff1cf;
      }

      #message-layer {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        display: grid;
        gap: 0;
        opacity: 0;
        pointer-events: none;
        z-index: 3900;
      }

      .message-layer--visible {
        opacity: 1 !important;
      }

      .message-entry {
        min-height: var(--terminal-line-height);
        padding: 0;
        border: 0;
        background: var(--bg);
        box-shadow: none;
        white-space: pre;
        overflow: hidden;
        text-overflow: clip;
        font-size: var(--terminal-font-size);
        line-height: var(--terminal-line-height);
      }

      .message-entry--emsg,
      .message-entry--echoerr,
      .message-entry--lua_error,
      .message-entry--rpc_error {
        color: #ff9a9a;
        background: var(--bg);
      }

      #message-status-layer {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) auto;
        gap: 0;
        padding: 0;
        font-size: var(--terminal-font-size);
        line-height: var(--terminal-line-height);
        color: var(--text);
        background: var(--bg);
        opacity: 0;
        pointer-events: none;
        z-index: 3950;
      }

      .message-status-layer--visible {
        opacity: 1 !important;
      }

      .message-status__center {
        text-align: center;
      }

      .message-status__right {
        text-align: right;
      }

      #message-history-layer {
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        width: min(760px, calc(100% - 48px));
        max-height: min(60vh, 640px);
        overflow: auto;
        padding: 14px;
        display: grid;
        gap: 8px;
        border: 1px solid rgba(255, 255, 255, 0.08);
        background: rgba(12, 14, 19, 0.97);
        box-shadow: 0 18px 50px rgba(0, 0, 0, 0.45);
        opacity: 0;
        pointer-events: none;
        z-index: 4200;
      }

      .message-history-layer--visible {
        opacity: 1 !important;
      }

      .message-history-entry {
        padding: 6px 8px;
        white-space: pre-wrap;
        border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      }

      .window-frame {
        position: absolute;
        border: 0;
        box-shadow: none;
      }

      .window-frame--active {
        box-shadow: none;
      }

      .window-frame__label {
        display: none;
      }

      .stage::before {
        content: none;
      }

      #web-view-layer {
        pointer-events: none;
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        overflow: hidden;
      }

      .web-view-box {
        pointer-events: auto;
        position: absolute;
        border: 0;
        background: white;
        box-shadow: none;
        overflow: hidden;
        display: block;
      }

      .web-view-box--active {
        box-shadow: none;
      }

      .web-view-box--web-mode {
        box-shadow: none;
      }

      .web-view-box__mode-frame {
        display: none;
        position: absolute;
        inset: 0;
        pointer-events: none;
        z-index: 10;
        box-sizing: border-box;
        border: 2px solid #ff9f45;
        outline: 2px solid rgba(255, 255, 255, 0.88);
        outline-offset: -4px;
        box-shadow: 0 0 0 1px rgba(255, 159, 69, 0.55), 0 0 14px rgba(255, 159, 69, 0.35);
      }

      .web-view-box--web-mode > .web-view-box__mode-frame {
        display: block;
      }

      .web-view-box--parked {
        visibility: hidden;
        pointer-events: none;
      }

      .web-view-box__title {
        display: none;
      }

      .web-view-box__meta {
        display: none;
      }

      .web-view-box__browser {
        width: 100%;
        height: 100%;
        border: 0;
        background: white;
      }

      .presentation-text-status {
        position: absolute; right: 6px; bottom: 6px; z-index: 20;
        padding: 4px 8px; border: 1px solid #64748b; border-radius: 4px;
        background: #172033; color: #fff; font: 12px system-ui; cursor: pointer;
      }
      .presentation-text-status[data-status="ready"] { border-color: #4ade80; }
      .presentation-text-status[data-status="limited"],
      .presentation-text-status[data-status="error"] { border-color: #fb7185; }

      .web-view-box__mirror-cursor {
        position: absolute;
        border: 1px solid #4f7cff;
        background: rgba(79, 124, 255, 0.2);
        box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.55), 0 0 6px rgba(79, 124, 255, 0.45);
        mix-blend-mode: normal;
        pointer-events: none;
        opacity: 0;
        z-index: 2;
      }

      .web-view-box__mirror-cursor--visible {
        opacity: 1;
      }

      .sidebar {
        display: none;
      }

      body:not(.debug-ui) [data-text-source="worker"] .presentation-text-status:not([data-status="error"]):not([data-status="limited"]),
      body:not(.debug-ui) [data-provider-id="web"] .presentation-text-status,
      body:not(.debug-ui) .browser-profile-label,
      body:not(.debug-ui) .browser-popup-permission { display: none; }
      body.debug-ui .sidebar {
        display: block;
        padding: 18px;
        background: rgba(17, 18, 24, 0.88);
        backdrop-filter: blur(14px);
      }

      .sidebar h1 {
        margin: 0 0 14px;
        font-size: 18px;
        font-weight: 600;
      }

      .stats {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 10px;
        margin-bottom: 16px;
      }

      .stat {
        padding: 10px 12px;
        background: var(--panel);
        border: 1px solid rgba(255,255,255,0.06);
      }

      .stat__label {
        color: var(--muted);
        font-size: 11px;
        text-transform: uppercase;
      }

      .stat__value {
        margin-top: 6px;
        font-size: 18px;
      }

      .sidebar pre {
        margin: 0;
        padding: 14px;
        max-height: calc(100vh - 220px);
        overflow: auto;
        font-size: 12px;
        line-height: 1.45;
        background: var(--panel);
        border: 1px solid rgba(255,255,255,0.06);
      }

      @media (max-width: 960px) {
        .shell {
          grid-template-columns: 1fr;
        }

        .sidebar {
          order: -1;
        }
      }
      .browser-popup-permission {
        position: absolute; bottom: 36px; left: 6px; z-index: 5;
        padding: 4px 8px; color: white; background: #18202f; border: 1px solid #64748b;
        border-radius: 4px; font: 12px system-ui; cursor: pointer;
      }
      .browser-profile-label {
        position: absolute; bottom: 6px; left: 6px; z-index: 5;
        padding: 4px 8px; border-radius: 4px; background: #18202f;
        color: #fff; font: 12px system-ui; pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div id="cell-ruler">MMMMMMMMMM</div>
    <div class="shell">
      <div class="stage">
        <pre id="terminal-screen"></pre>
        <div id="grid-layer-root"></div>
        <div id="terminal-cursor"></div>
        <div id="window-frame-layer"></div>
        <div id="web-view-layer"></div>
        <div id="message-layer"></div>
        <div id="message-status-layer">
          <div data-role="showmode"></div>
          <div class="message-status__center" data-role="showcmd"></div>
          <div class="message-status__right" data-role="ruler"></div>
        </div>
        <div id="message-history-layer"></div>
        <div id="cmdline-block-layer"></div>
        <div id="popupmenu-layer"></div>
        <div id="cmdline-layer"></div>
      </div>
      <aside class="sidebar">
        <h1>jusi-neovim</h1>
        <div class="stats">
          <div class="stat"><div class="stat__label">Tab</div><div class="stat__value" id="status-tab">-</div></div>
          <div class="stat"><div class="stat__label">Buffers</div><div class="stat__value" id="status-buffers">-</div></div>
          <div class="stat"><div class="stat__label">Windows</div><div class="stat__value" id="status-windows">-</div></div>
          <div class="stat"><div class="stat__label">Web Views</div><div class="stat__value" id="status-webviews">-</div></div>
        </div>
        <pre id="state-dump"></pre>
      </aside>
    </div>
    <script type="module" src="../../dist/renderer/app.js"></script>
  </body>
  </html>
